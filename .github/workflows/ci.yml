name: CI

# Runs on every push and PR. Nothing here needs Firebase credentials — the
# backend suite covers the computation layer, the E2E job runs against local
# emulators with a throwaway demo project id, and the frontend build resolves
# VITE_* vars to undefined without failing. That is deliberate: a pipeline that
# needs secrets to run is a pipeline that silently stops running.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests
    # Pinned, not ubuntu-latest: the image changes on our schedule, not
    # GitHub's (latest moves to 26.04 from 19 Oct 2026). Bump all jobs together.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          # Same minor as backend/Dockerfile (python:3.11-slim): test what prod runs.
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest tests/ -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        # Vitest + Testing Library, in jsdom: API error handling, permalinks,
        # CSV export, the markdown renderer and the components with logic.
        run: npm test

      - name: Build
        run: npm run build

      - name: Bundle budget
        # Fails when the gzipped entry or total JS grows past
        # frontend/bundle-budget.json (~10% over the 19 Sep build). Raise the
        # limit in the same PR when the growth is intended.
        run: npm run check:bundle

  e2e:
    name: E2E (Playwright)
    # The real app, API and security rules against local Firebase emulators
    # (no project, no credentials, no Yahoo — prices are seeded). Covers the
    # logged-in paths the backend tests and the build cannot: every bug the
    # 12–13 Oct testers found lived there.
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      # The Firestore and Auth emulators run on the JVM.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install backend
        run: pip install -r backend/requirements-dev.txt

      - name: Install frontend and e2e
        run: |
          npm ci --prefix frontend
          npm ci --prefix e2e

      - name: Install browser
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Backend tests against the Firestore emulator
        # The shared rate limit across two clients (two Cloud Run instances)
        # and the admin aggregation queries. The backend job skips these
        # files without an emulator.
        run: >
          e2e/node_modules/.bin/firebase emulators:exec --only firestore --project demo-finertia
          "cd backend && python -m pytest -q tests/test_shared_ratelimit_firestore.py tests/test_admin_queries_firestore.py"

      - name: Run end-to-end tests
        working-directory: e2e
        env:
          PYTHON: python
        run: npx playwright test

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - name: Fail if a credential file was committed
        # The service account private key would be the worst thing to leak, and
        # .gitignore only helps for files that were never added. This is the
        # backstop for a `git add -f` or a rule edited away later.
        run: |
          set -e
          if git ls-files | grep -Ei '(^|/)\.env$|serviceAccount.*\.json|firebase-adminsdk.*\.json'; then
            echo "::error::A credential file is tracked in git. Remove it and rotate the key."
            exit 1
          fi
          if git grep -l -- "-----BEGIN PRIVATE KEY-----" -- . ':!*.yml'; then
            echo "::error::A private key is present in tracked source."
            exit 1
          fi
          echo "No credential files tracked."
