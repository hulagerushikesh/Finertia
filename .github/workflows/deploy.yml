name: Deploy

# Manual by default. Automatic deploys on every push to main are a good way to
# ship a broken backtest engine to production at 2am; `workflow_dispatch` means
# a deploy is always a decision. Uncomment the push trigger once you trust it.
on:
  workflow_dispatch:
    inputs:
      target:
        description: What to deploy
        required: true
        default: both
        type: choice
        options: [both, frontend, backend]
  # push:
  #   branches: [main]

concurrency:
  # Two overlapping deploys can leave the frontend pointing at a backend
  # revision that no longer exists.
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    name: Tests must pass first
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt pytest
      - run: pytest tests/ -q

  backend:
    name: Backend → Cloud Run
    needs: test
    if: inputs.target == 'both' || inputs.target == 'backend'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      # Workload Identity Federation rather than a long-lived service account
      # key in a repo secret — the key would be a permanent credential sitting
      # in GitHub, and this project already treats leaked keys as the top risk.
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy
        working-directory: backend
        run: |
          gcloud run deploy finertia-api \
            --source . \
            --region "${{ vars.GCP_REGION || 'us-central1' }}" \
            --allow-unauthenticated \
            --set-secrets "FIREBASE_SERVICE_ACCOUNT_JSON=firebase-sa:latest" \
            --set-env-vars "ALLOWED_ORIGINS=${{ vars.ALLOWED_ORIGINS }}"

      - name: Verify the new revision is actually serving
        run: |
          URL=$(gcloud run services describe finertia-api \
            --region "${{ vars.GCP_REGION || 'us-central1' }}" \
            --format 'value(status.url)')
          echo "Deployed to $URL"
          # A deploy that "succeeded" but serves 500s is not a successful deploy.
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$URL/api/health") && [ "$code" = "200" ] && exit 0
            echo "health check returned $code, retrying ($i/5)"; sleep 6
          done
          echo "::error::New revision never returned a healthy /api/health"
          exit 1

  frontend:
    name: Frontend → Firebase Hosting
    needs: test
    if: inputs.target == 'both' || inputs.target == 'frontend'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - name: Build
        working-directory: frontend
        # VITE_* values are compiled into the bundle and are public by design —
        # Firebase web config is not a secret. They live in repo *variables*
        # rather than secrets to make that explicit.
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
        run: npm run build

      - name: Fail if the API base URL was not set
        working-directory: frontend
        # Vite resolves a missing VITE_* to undefined without complaining, which
        # would ship a build that silently calls localhost from production.
        run: |
          if grep -rq "localhost:8000" dist/assets/*.js; then
            echo "::error::Built bundle still points at localhost — set the VITE_API_BASE_URL variable."
            exit 1
          fi

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
