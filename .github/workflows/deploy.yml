name: Deploy

# Backend only. The frontend is deployed by Vercel on every push to main
# (frontend/vercel.json carries the SPA fallback and the /api/* rewrite), so
# there is nothing for this workflow to build or upload.
#
# Manual by default. Automatic deploys on every push to main are a good way to
# ship a broken backtest engine to production at 2am — and, on Cloud Run, a
# good way to change a billing cap by accident. `workflow_dispatch` means a
# deploy is always a decision. Uncomment the push trigger once you trust it.
on:
  workflow_dispatch:
    inputs:
      region:
        # us-central1 serves the site since B1 (1 Nov), next to Firestore nam5
        # (planning/B1-REGION-MOVE.md). asia-south1 is kept for a week as the
        # rollback: deploying there changes nothing users hit.
        description: Cloud Run region
        type: choice
        options: [asia-south1, us-central1]
        default: us-central1
  # push:
  #   branches: [main]
  #   paths: [backend/**]

env:
  # The region users reach through the vercel.json rewrite. Only a deploy
  # there moves the backend-deployed tag; a deploy elsewhere is a staging step.
  SERVING_REGION: us-central1

concurrency:
  # Two overlapping deploys race for the same revision name.
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    name: Tests must pass first
    # Pinned, not ubuntu-latest: the image changes on our schedule, not
    # GitHub's (latest moves to 26.04 from 19 Oct 2026). Bump all jobs together.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          # Same minor as backend/Dockerfile (python:3.11-slim): test what prod runs.
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest tests/ -q

  backend:
    name: Backend → Cloud Run
    needs: test
    runs-on: ubuntu-24.04
    env:
      REGION: ${{ inputs.region || 'us-central1' }}
    permissions:
      contents: write   # moves the backend-deployed tag after a healthy deploy
      id-token: write
    steps:
      - uses: actions/checkout@v5

      # Workload Identity Federation rather than a long-lived service account
      # key in a repo secret — the key would be a permanent credential sitting
      # in GitHub, and this project already treats leaked keys as the top risk.
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      # Same command as README "Deploy", flag for flag. The caps are the cost
      # ceiling (idle = ₹0); change them here and in the README together, never
      # in one place. ALLOWED_ORIGINS and LOG_LEVEL are set on the service and
      # persist across deploys, so they are deliberately not passed here — an
      # unset repo variable would otherwise blank them.
      - name: Deploy
        working-directory: backend
        env:
          # Error reporting (backend/monitoring.py). A DSN can only send events
          # to the project, not read them, so it is config rather than a secret.
          # --update-env-vars changes these variables and leaves the rest.
          # GIT_SHA is what /api/health reports as `commit`.
          SENTRY_DSN: https://3e79d3553ba15e22d80c2b964eb2bc47@o4512247279976448.ingest.us.sentry.io/4512247309402112
        run: |
          gcloud run deploy finertia-api \
            --source . \
            --region "$REGION" \
            --project momentbacktracking \
            --min-instances 0 --max-instances 2 --memory 512Mi --cpu 1 --concurrency 40 --cpu-boost \
            --service-account finertia-api-runtime@momentbacktracking.iam.gserviceaccount.com \
            --set-secrets "FIREBASE_SERVICE_ACCOUNT_JSON=finertia-sa:latest" \
            --update-env-vars "SENTRY_DSN=$SENTRY_DSN,GIT_SHA=$GITHUB_SHA" \
            --allow-unauthenticated \
            --quiet

      - name: Verify the new revision is actually serving
        run: |
          URL=$(gcloud run services describe finertia-api \
            --region "$REGION" --project momentbacktracking \
            --format 'value(status.url)')
          echo "Deployed to $URL"
          # A deploy that "succeeded" but serves 500s is not a successful deploy,
          # and neither is one where the old revision still answers.
          for i in 1 2 3 4 5; do
            body=$(curl -s -w '\n%{http_code}' "$URL/api/health") || body=""
            code=$(echo "$body" | tail -n1)
            commit=$(echo "$body" | head -n1 | python3 -c 'import json,sys; print(json.load(sys.stdin).get("commit") or "")' 2>/dev/null || true)
            if [ "$code" = "200" ] && [ "$commit" = "$GITHUB_SHA" ]; then
              echo "healthy, serving $commit"; exit 0
            fi
            echo "health returned $code serving '${commit:-?}', want $GITHUB_SHA; retrying ($i/5)"; sleep 6
          done
          echo "::error::New revision never returned a healthy /api/health for $GITHUB_SHA"
          exit 1

      # backend-drift.yml diffs backend/ against this tag on every push to
      # main and comments on the merged PR when production is behind.
      - name: Mark this commit as deployed
        if: env.REGION == env.SERVING_REGION
        run: |
          git tag -f backend-deployed "$GITHUB_SHA"
          git push -f origin backend-deployed
