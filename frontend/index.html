<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Test a trading idea before you risk money on it. Pick a stock, a rule and a stretch of years; Finertia shows what would have happened, then checks whether the result was skill or luck."
    />
    <title>Finertia — Test a trading idea before you risk money on it</title>
    <link rel="canonical" href="https://finertia.hulage.in/" />
    <!-- Icon: the wordmark's serif F with a pencil underline — the mark the
         app puts under every out-of-sample number. SVG for modern tabs, ICO
         for the rest, PNG for iOS home screens (which round its own corners). -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#F0F8FF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0F172A" media="(prefers-color-scheme: dark)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=IBM+Plex+Mono:wght@400;500&display=swap"
    />

    <!-- Open Graph / Twitter. Without these a shared link renders as a bare
         URL, which is the difference between a click and a scroll past. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Finertia" />
    <meta property="og:title" content="Test a trading idea before you risk money on it." />
    <meta
      property="og:description"
      content="Pick a stock, a rule and a stretch of years. Finertia shows what would have happened — then checks whether it was skill or luck. Free to start."
    />
    <meta property="og:url" content="https://finertia.hulage.in/" />
    <meta property="og:image" content="https://finertia.hulage.in/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Finertia — Your backtest looks good. That's the problem." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://finertia.hulage.in/og.png" />
    <meta name="twitter:title" content="Test a trading idea before you risk money on it." />
    <meta
      name="twitter:description"
      content="Pick a stock, a rule and a stretch of years. Finertia shows what would have happened — then checks whether it was skill or luck. Free to start."
    />

    <!-- A single-page app returns 200 for every path, so crawlers cannot learn
         the routes by following links alone. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Finertia",
        "applicationCategory": "FinanceApplication",
        "operatingSystem": "Web",
        "description": "Strategy backtesting with walk-forward validation and permutation testing.",
        "offers": [
          { "@type": "Offer", "price": "0", "priceCurrency": "USD", "name": "Free" },
          { "@type": "Offer", "price": "12", "priceCurrency": "USD", "name": "Pro" }
        ]
      }
    </script>
  </head>
  <body>
    <script>
      // Paint the stored theme before the first frame so a dark reader never
      // sees a white flash. next-themes takes over once React mounts.
      try {
        var t = localStorage.getItem("finertia-theme");
        var dark = t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
