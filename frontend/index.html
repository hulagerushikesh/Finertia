<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Backtest momentum, MACD, and mean-reversion strategies on real market data — then check whether the result survives walk-forward validation and a signal permutation test."
    />
    <title>Finertia — Strategy Backtesting</title>
    <link rel="canonical" href="https://finertia.hulage.in/" />
    <meta name="theme-color" content="#F4F5F7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0F1115" media="(prefers-color-scheme: dark)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
    />

    <!-- Open Graph / Twitter. Without these a shared link renders as a bare
         URL, which is the difference between a click and a scroll past. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Finertia" />
    <meta property="og:title" content="Backtest a Strategy. Then Find Out If It's Real." />
    <meta
      property="og:description"
      content="Any backtest can be tuned until it looks good. Finertia scores your parameters on data they were never fitted to."
    />
    <meta property="og:url" content="https://finertia.hulage.in/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Backtest a Strategy. Then Find Out If It's Real." />
    <meta
      name="twitter:description"
      content="Walk-forward validation and permutation tests on a hand-written backtesting engine. No external backtesting libraries."
    />

    <!-- A single-page app returns 200 for every path, so crawlers cannot learn
         the routes by following links alone. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Finertia",
        "applicationCategory": "FinanceApplication",
        "operatingSystem": "Web",
        "description": "Strategy backtesting with walk-forward validation and permutation testing.",
        "offers": [
          { "@type": "Offer", "price": "0", "priceCurrency": "USD", "name": "Free" },
          { "@type": "Offer", "price": "12", "priceCurrency": "USD", "name": "Pro" }
        ]
      }
    </script>
  </head>
  <body>
    <script>
      // Paint the stored theme before the first frame so a dark reader never
      // sees a white flash. next-themes takes over once React mounts.
      try {
        var t = localStorage.getItem("finertia-theme");
        var dark = t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
