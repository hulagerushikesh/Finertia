<!--
  Source for public/og-writeup.png, the share card for /writeup. Render with
  headless Chrome at exactly 1200×630 (fonts come from Google Fonts, so give it
  a virtual-time budget), from frontend/:

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new \
      --disable-gpu --hide-scrollbars --window-size=1200,630 --virtual-time-budget=8000 \
      --screenshot=public/og-writeup.png "file://$PWD/design/og-writeup.html"

  The figures are the first table of planning/write-up.md, rounded to two
  places. If that table changes, change these and re-render.
-->
<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root { --ink: #0F172A; --chalk: #F1F5F9; --mute: #94A3B8; --line: #1E293B; --mint: #34D399; --red: #F87171; }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: var(--ink); }
  body { font-family: "DM Sans", sans-serif; color: var(--chalk); padding: 64px 72px; position: relative; }
  .brand { display: flex; align-items: center; gap: 14px; font-weight: 700; font-size: 26px; letter-spacing: -0.01em; }
  .brand span { color: var(--mint); }
  .eyebrow { margin-left: auto; font-family: "IBM Plex Mono", monospace; font-size: 17px; color: var(--mute); letter-spacing: 0.08em; text-transform: uppercase; }
  h1 { margin-top: 44px; font-weight: 700; font-size: 60px; line-height: 1.04; letter-spacing: -0.03em; max-width: 1000px; }
  h1 em { font-style: normal; color: var(--mint); }
  table { margin-top: 40px; border-collapse: collapse; font-size: 24px; }
  th { font-family: "IBM Plex Mono", monospace; font-weight: 400; font-size: 15px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--mute); text-align: right; padding: 0 0 12px 56px; }
  th:first-child { text-align: left; padding-left: 0; }
  td { padding: 11px 0 11px 56px; border-top: 1px solid var(--line); text-align: right; font-family: "IBM Plex Mono", monospace; font-weight: 500; }
  td:first-child { text-align: left; padding-left: 0; font-family: "DM Sans", sans-serif; font-weight: 600; }
  .is { color: var(--chalk); }
  .bad { color: var(--red); }
  .good { color: var(--mint); }
  .tag { font-family: "DM Sans", sans-serif; font-size: 18px; font-weight: 500; color: var(--mute); }
  .foot { position: absolute; left: 72px; right: 72px; bottom: 56px; display: flex; justify-content: space-between; font-size: 19px; color: var(--mute); }
  .foot b { font-family: "IBM Plex Mono", monospace; font-weight: 400; }
</style>
</head>
<body>
  <div class="brand">
    <svg width="40" height="40" viewBox="0 0 64 64" aria-hidden="true">
      <rect width="64" height="64" rx="14" fill="#1E293B"/>
      <g fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M11 47 L23 36 L31 42 L40 29" stroke="#F1F5F9"/>
        <path d="M40 29 L54 15" stroke="#34D399"/>
      </g>
    </svg>
    <div>Finertia<span>.</span></div>
    <div class="eyebrow">Research write-up</div>
  </div>

  <h1>The best-looking strategy was <em>the worst</em> on new data.</h1>

  <table>
    <tr><th>AAPL 2018–2024 · Sharpe</th><th>Tuned on</th><th>New data</th><th></th></tr>
    <tr><td>Momentum</td><td class="is">0.95</td><td class="bad">−0.30</td><td class="tag">failed</td></tr>
    <tr><td>MACD</td><td class="is">0.51</td><td class="bad">−0.30</td><td class="tag">failed</td></tr>
    <tr><td>Bollinger</td><td class="is">0.56</td><td class="good">1.17</td><td class="tag">held up</td></tr>
  </table>

  <div class="foot">
    <div>Every figure re-run and checked by a script.</div>
    <b>finertia.hulage.in/writeup</b>
  </div>
</body>
</html>
